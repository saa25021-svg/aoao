<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOAO Cloud Task & Note</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(229, 231, 235, 0.7);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-sky-500 selection:text-white">

    <!-- Navigation Bar -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-sky-500 to-indigo-600 text-white p-2 rounded-xl shadow-md">
                    <i class="fa-solid font-bold fa-cloud-bolt text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-sky-600 to-indigo-600">AOAO Cloud</h1>
                    <p class="text-xs text-slate-400 font-medium">Task & Knowledge Hub</p>
                </div>
            </div>

            <!-- User Auth Status / Actions -->
            <div id="auth-status-container" class="flex items-center space-x-3">
                <!-- Skeleton Loader -->
                <div id="auth-skeleton" class="animate-pulse flex items-center space-x-2">
                    <div class="w-8 h-8 bg-slate-200 rounded-full"></div>
                    <div class="w-20 h-4 bg-slate-200 rounded"></div>
                </div>

                <!-- Unauthenticated View -->
                <button id="login-btn" class="hidden inline-flex items-center gap-2 bg-sky-600 hover:bg-sky-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition-all shadow-sm hover:shadow active:scale-95">
                    <i class="fa-brands fa-google"></i>
                    <span>Google ログイン</span>
                </button>

                <!-- Authenticated View -->
                <div id="user-profile" class="hidden flex items-center gap-3">
                    <img id="user-avatar" class="w-9 h-9 rounded-full ring-2 ring-sky-500/30 object-cover" src="" alt="User Avatar">
                    <div class="hidden sm:block text-left">
                        <div id="user-name" class="text-xs font-semibold text-slate-700"></div>
                        <div id="user-email" class="text-[10px] text-slate-400"></div>
                    </div>
                    <button id="logout-btn" title="ログアウト" class="text-slate-400 hover:text-red-500 p-2 rounded-lg hover:bg-slate-100 transition-colors">
                        <i class="fa-solid fa-right-from-bracket text-base"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- Welcome Banner for Guest -->
        <div id="guest-hero" class="hidden my-12 text-center max-w-2xl mx-auto py-12 px-6 rounded-3xl bg-gradient-to-b from-sky-50 to-white border border-sky-100 shadow-xl shadow-sky-500/5">
            <div class="w-16 h-16 bg-sky-100 text-sky-600 rounded-2xl flex items-center justify-center mx-auto mb-6 text-2xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-3">Google ログインが必要です</h2>
            <p class="text-slate-500 text-sm sm:text-base mb-8">
                AOAO Cloud へようこそ。Googleアカウントでログインすると、自分専用のタスクやメモのリアルタイムクラウド管理がご利用いただけます。
            </p>
            <button id="hero-login-btn" class="inline-flex items-center gap-2 bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-700 hover:to-indigo-700 text-white font-medium px-6 py-3 rounded-xl shadow-lg shadow-sky-500/20 transition-all hover:scale-105 active:scale-95">
                <i class="fa-brands fa-google"></i>
                <span>Google で安全にログイン</span>
            </button>
        </div>

        <!-- Authenticated Dashboard -->
        <div id="dashboard" class="hidden space-y-6">
            
            <!-- Dashboard Controls & Filter Header -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                <!-- Tabs -->
                <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-xl w-full md:w-auto">
                    <button id="tab-my-tasks" class="tab-btn flex-1 md:flex-initial px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all bg-white text-slate-800 shadow-sm">
                        <i class="fa-solid fa-user-check mr-1.5 text-sky-500"></i>マイタスク & メモ
                    </button>
                    <button id="tab-public-board" class="tab-btn flex-1 md:flex-initial px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all text-slate-500 hover:text-slate-800">
                        <i class="fa-solid fa-globe mr-1.5 text-indigo-500"></i>パブリック掲示板
                    </button>
                </div>

                <!-- Search & Add Action -->
                <div class="flex items-center gap-3">
                    <div class="relative flex-1 sm:w-64">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input id="search-input" type="text" placeholder="キーワードで検索..." class="w-full pl-9 pr-4 py-2 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500/50 transition-all">
                    </div>
                    <button id="open-create-modal" class="whitespace-nowrap inline-flex items-center gap-2 bg-sky-600 hover:bg-sky-700 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all shadow-md shadow-sky-500/10 active:scale-95">
                        <i class="fa-solid fa-plus"></i>
                        <span>新規追加</span>
                    </button>
                </div>
            </div>

            <!-- Content Grid List -->
            <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Items will be injected dynamically -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden py-16 text-center border-2 border-dashed border-slate-200 rounded-2xl">
                <i class="fa-regular fa-folder-open text-4xl text-slate-300 mb-3"></i>
                <p class="text-slate-500 font-medium text-sm">表示するデータがありません</p>
                <p class="text-slate-400 text-xs mt-1">「新規追加」ボタンからタスクやメモを作成してください。</p>
            </div>
        </div>
    </main>

    <!-- Create / Edit Modal -->
    <div id="item-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden transition-opacity">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl w-full max-w-lg overflow-hidden transform transition-all">
            <!-- Modal Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
                <h3 id="modal-title" class="font-bold text-slate-800 text-base">新規タスク / メモの追加</h3>
                <button id="close-modal-btn" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <!-- Modal Form -->
            <form id="item-form" class="p-6 space-y-4">
                <input type="hidden" id="item-id">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">タイトル <span class="text-red-500">*</span></label>
                    <input type="text" id="item-title" required placeholder="例: GitHub Pages の自動デプロイ設定を行う" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500/50">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">カテゴリー / タグ</label>
                        <select id="item-tag" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500/50">
                            <option value="Task">Task (タスク)</option>
                            <option value="Idea">Idea (アイデア)</option>
                            <option value="Memo">Memo (メモ)</option>
                            <option value="Bug">Bug (修正)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">公開範囲</label>
                        <select id="item-visibility" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500/50">
                            <option value="private">自分のみ (プライベート)</option>
                            <option value="public">パブリック (掲示板共有)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ステータス</label>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="cursor-pointer border border-slate-200 rounded-xl p-2 text-center hover:bg-slate-50 has-[:checked]:bg-sky-50 has-[:checked]:border-sky-500 transition-all">
                            <input type="radio" name="status" value="todo" checked class="hidden">
                            <span class="text-xs font-medium text-slate-700">To Do</span>
                        </label>
                        <label class="cursor-pointer border border-slate-200 rounded-xl p-2 text-center hover:bg-slate-50 has-[:checked]:bg-amber-50 has-[:checked]:border-amber-500 transition-all">
                            <input type="radio" name="status" value="doing" class="hidden">
                            <span class="text-xs font-medium text-slate-700">Doing</span>
                        </label>
                        <label class="cursor-pointer border border-slate-200 rounded-xl p-2 text-center hover:bg-slate-50 has-[:checked]:bg-emerald-50 has-[:checked]:border-emerald-500 transition-all">
                            <input type="radio" name="status" value="done" class="hidden">
                            <span class="text-xs font-medium text-slate-700">Done</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">詳細内容</label>
                    <textarea id="item-content" rows="4" placeholder="詳細やリンクなどをメモ..." class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500/50 resize-none"></textarea>
                </div>

                <div class="pt-2 flex justify-end gap-3">
                    <button type="button" id="cancel-modal-btn" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-xl transition-all">キャンセル</button>
                    <button type="submit" id="save-item-btn" class="inline-flex items-center gap-1.5 bg-sky-600 hover:bg-sky-700 text-white px-5 py-2 rounded-xl text-xs font-medium transition-all shadow-sm">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>保存する</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 flex items-center gap-3 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-xl transform translate-y-20 opacity-0 transition-all duration-300">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-message" class="text-xs font-medium"></span>
    </div>

    <script type="module">
        // Import Firebase SDK v11 ESM Modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            onSnapshot, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // User Specified Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyB9zzbKz1v-7qvofoe3jEnRgIGUBX8h5SY",
            authDomain: "aoao-95011.firebaseapp.com",
            projectId: "aoao-95011",
            storageBucket: "aoao-95011.firebasestorage.app",
            messagingSenderId: "820190860061",
            appId: "1:820190860061:web:9213e73295f410454507f4"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Application State
        let currentUser = null;
        let activeTab = 'private'; // 'private' or 'public'
        let currentItems = [];
        let unsubscribeSnapshot = null;

        // Application ID constant for strict pathing
        const appId = 'aoao-app';

        // DOM Elements
        const authSkeleton = document.getElementById('auth-skeleton');
        const loginBtn = document.getElementById('login-btn');
        const heroLoginBtn = document.getElementById('hero-login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const userProfile = document.getElementById('user-profile');
        const userAvatar = document.getElementById('user-avatar');
        const userName = document.getElementById('user-name');
        const userEmail = document.getElementById('user-email');

        const guestHero = document.getElementById('guest-hero');
        const dashboard = document.getElementById('dashboard');

        const tabMyTasks = document.getElementById('tab-my-tasks');
        const tabPublicBoard = document.getElementById('tab-public-board');
        const searchInput = document.getElementById('search-input');
        const cardsContainer = document.getElementById('cards-container');
        const emptyState = document.getElementById('empty-state');

        const modal = document.getElementById('item-modal');
        const openCreateModalBtn = document.getElementById('open-create-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const cancelModalBtn = document.getElementById('cancel-modal-btn');
        const itemForm = document.getElementById('item-form');

        // Toast Helper
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastIcon = document.getElementById('toast-icon');
            const toastMessage = document.getElementById('toast-message');

            toastMessage.textContent = message;
            if (type === 'error') {
                toastIcon.className = 'fa-solid fa-circle-exclamation text-rose-400';
            } else {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3500);
        }

        // Google Login Action
        async function handleLogin() {
            try {
                await signInWithPopup(auth, provider);
                showToast('Google ログインに成功しました！');
            } catch (error) {
                console.error("Login Error:", error);
                if (error.code === 'auth/unauthorized-domain') {
                    showToast('Firebaseの承認済みドメイン設定にGitHub Pagesのドメインを追加してください。', 'error');
                } else {
                    showToast(`ログインエラー: ${error.message}`, 'error');
                }
            }
        }

        // Logout Action
        async function handleLogout() {
            try {
                await signOut(auth);
                showToast('ログアウトしました');
            } catch (error) {
                showToast('ログアウト処理に失敗しました', 'error');
            }
        }

        loginBtn.addEventListener('click', handleLogin);
        heroLoginBtn.addEventListener('click', handleLogin);
        logoutBtn.addEventListener('click', handleLogout);

        // Auth Observer
        onAuthStateChanged(auth, (user) => {
            authSkeleton.classList.add('hidden');
            if (user) {
                currentUser = user;
                // Update User Info
                userAvatar.src = user.photoURL || `https://placehold.co/100x100/0284c7/ffffff?text=${encodeURIComponent(user.displayName?.[0] || 'U')}`;
                userName.textContent = user.displayName || 'ユーザー';
                userEmail.textContent = user.email || '';

                loginBtn.classList.add('hidden');
                userProfile.classList.remove('hidden');
                guestHero.classList.add('hidden');
                dashboard.classList.remove('hidden');

                // Load Firestore Data
                loadData();
            } else {
                currentUser = null;
                userProfile.classList.add('hidden');
                loginBtn.classList.remove('hidden');
                guestHero.classList.remove('hidden');
                dashboard.classList.add('hidden');

                if (unsubscribeSnapshot) {
                    unsubscribeSnapshot();
                    unsubscribeSnapshot = null;
                }
            }
        });

        function getCollectionRef(visibility) {
            if (visibility === 'public') {
                return collection(db, 'artifacts', appId, 'public', 'data', 'board_items');
            } else {
                return collection(db, 'artifacts', appId, 'users', currentUser.uid, 'tasks');
            }
        }

        function loadData() {
            if (!currentUser) return;

            if (unsubscribeSnapshot) {
                unsubscribeSnapshot();
            }

            const colRef = getCollectionRef(activeTab);

            // Fetch Data Realtime
            unsubscribeSnapshot = onSnapshot(colRef, (snapshot) => {
                const items = [];
                snapshot.forEach((doc) => {
                    items.push({ id: doc.id, ...doc.data() });
                });

                // In-memory sort by createdAt descending
                items.sort((a, b) => {
                    const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : Date.now();
                    const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : Date.now();
                    return timeB - timeA;
                });

                currentItems = items;
                renderCards();
            }, (error) => {
                console.error("Firestore Listen Error:", error);
                showToast("データの読み込みに失敗しました", "error");
            });
        }

        function renderCards() {
            const query = searchInput.value.trim().toLowerCase();
            const filtered = currentItems.filter(item => {
                const titleMatch = item.title?.toLowerCase().includes(query);
                const contentMatch = item.content?.toLowerCase().includes(query);
                const tagMatch = item.tag?.toLowerCase().includes(query);
                return titleMatch || contentMatch || tagMatch;
            });

            cardsContainer.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "glass-card rounded-2xl p-5 shadow-sm hover:shadow-md transition-all border border-slate-200/80 flex flex-col justify-between group";

                // Badge Colors
                let statusBadge = '';
                if (item.status === 'todo') {
                    statusBadge = `<span class="bg-sky-50 text-sky-700 border border-sky-200 text-[10px] font-semibold px-2.5 py-0.5 rounded-full"><i class="fa-regular fa-circle mr-1"></i>To Do</span>`;
                } else if (item.status === 'doing') {
                    statusBadge = `<span class="bg-amber-50 text-amber-700 border border-amber-200 text-[10px] font-semibold px-2.5 py-0.5 rounded-full"><i class="fa-solid fa-spinner mr-1"></i>Doing</span>`;
                } else {
                    statusBadge = `<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-semibold px-2.5 py-0.5 rounded-full"><i class="fa-solid fa-circle-check mr-1"></i>Done</span>`;
                }

                const canEdit = activeTab === 'private' || item.userId === currentUser?.uid;

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between gap-2 mb-2">
                            <span class="text-[11px] font-bold tracking-wide uppercase px-2 py-0.5 rounded-md bg-slate-100 text-slate-600">${escapeHtml(item.tag || 'Memo')}</span>
                            ${statusBadge}
                        </div>
                        <h4 class="font-bold text-slate-800 text-sm sm:text-base line-clamp-2 mb-2">${escapeHtml(item.title)}</h4>
                        <p class="text-xs text-slate-600 whitespace-pre-wrap leading-relaxed line-clamp-4 mb-4">${escapeHtml(item.content || '詳細なし')}</p>
                    </div>

                    <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
                        <div class="flex items-center gap-1.5 truncate max-w-[150px]">
                            ${activeTab === 'public' ? `<img src="${item.userPhoto || 'https://placehold.co/50'}" class="w-4 h-4 rounded-full object-cover"> <span class="truncate">${escapeHtml(item.userName || '匿名')}</span>` : `<span>${formatDate(item.createdAt)}</span>`}
                        </div>
                        
                        ${canEdit ? `
                        <div class="flex items-center gap-1 opacity-90 sm:opacity-0 group-hover:opacity-100 transition-opacity">
                            <button class="edit-btn p-1.5 hover:bg-slate-100 text-slate-500 hover:text-sky-600 rounded-lg transition-colors" title="編集">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button class="delete-btn p-1.5 hover:bg-slate-100 text-slate-500 hover:text-red-500 rounded-lg transition-colors" title="削除">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                        ` : ''}
                    </div>
                `;

                // Attach Event Handlers
                if (canEdit) {
                    const editBtn = card.querySelector('.edit-btn');
                    const deleteBtn = card.querySelector('.delete-btn');

                    if (editBtn) editBtn.addEventListener('click', () => openModalForEdit(item));
                    if (deleteBtn) deleteBtn.addEventListener('click', () => deleteItem(item.id));
                }

                cardsContainer.appendChild(card);
            });
        }

        // Tab Switches
        tabMyTasks.addEventListener('click', () => {
            activeTab = 'private';
            tabMyTasks.className = "tab-btn flex-1 md:flex-initial px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all bg-white text-slate-800 shadow-sm";
            tabPublicBoard.className = "tab-btn flex-1 md:flex-initial px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all text-slate-500 hover:text-slate-800";
            loadData();
        });

        tabPublicBoard.addEventListener('click', () => {
            activeTab = 'public';
            tabPublicBoard.className = "tab-btn flex-1 md:flex-initial px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all bg-white text-slate-800 shadow-sm";
            tabMyTasks.className = "tab-btn flex-1 md:flex-initial px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all text-slate-500 hover:text-slate-800";
            loadData();
        });

        searchInput.addEventListener('input', renderCards);

        function openModalForCreate() {
            itemForm.reset();
            document.getElementById('item-id').value = '';
            document.getElementById('modal-title').textContent = '新規タスク / メモの追加';
            document.getElementById('item-visibility').value = activeTab;
            modal.classList.remove('hidden');
        }

        function openModalForEdit(item) {
            document.getElementById('item-id').value = item.id;
            document.getElementById('item-title').value = item.title;
            document.getElementById('item-tag').value = item.tag || 'Task';
            document.getElementById('item-visibility').value = activeTab;
            document.getElementById('item-content').value = item.content || '';
            
            const radio = itemForm.querySelector(`input[name="status"][value="${item.status || 'todo'}"]`);
            if (radio) radio.checked = true;

            document.getElementById('modal-title').textContent = 'タスク / メモの編集';
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
        }

        openCreateModalBtn.addEventListener('click', openModalForCreate);
        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);

        // Submit Handler
        itemForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const id = document.getElementById('item-id').value;
            const title = document.getElementById('item-title').value.trim();
            const tag = document.getElementById('item-tag').value;
            const visibility = document.getElementById('item-visibility').value;
            const status = itemForm.querySelector('input[name="status"]:checked').value;
            const content = document.getElementById('item-content').value.trim();

            if (!title) return;

            const targetCol = getCollectionRef(visibility);

            const payload = {
                title,
                tag,
                status,
                content,
                userId: currentUser.uid,
                userName: currentUser.displayName || 'ユーザー',
                userPhoto: currentUser.photoURL || '',
                updatedAt: serverTimestamp()
            };

            try {
                if (id) {
                    // Update existing
                    const docRef = doc(targetCol, id);
                    await updateDoc(docRef, payload);
                    showToast('更新しました');
                } else {
                    // Add new
                    payload.createdAt = serverTimestamp();
                    await addDoc(targetCol, payload);
                    showToast('追加しました');
                }
                closeModal();
            } catch (err) {
                console.error("Save Error:", err);
                showToast("保存処理に失敗しました", "error");
            }
        });

        async function deleteItem(id) {
            if (!confirm('本当に削除しますか？')) return;
            try {
                const targetCol = getCollectionRef(activeTab);
                await deleteDoc(doc(targetCol, id));
                showToast('削除しました');
            } catch (err) {
                console.error("Delete Error:", err);
                showToast("削除に失敗しました", "error");
            }
        }

        // Helper Utilities
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        function formatDate(timestamp) {
            if (!timestamp) return '直近';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return `${date.getMonth() + 1}/${date.getDate()} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
        }
    </script>
</body>
</html>
